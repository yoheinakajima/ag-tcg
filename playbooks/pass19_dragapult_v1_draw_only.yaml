# ActiveGraph Pass 19 — Dragapult ex, v1 DRAW-ONLY ablation (diagnostic).
#
# Derived from playbooks/pass18_dragapult_spread_v1.yaml by DROPPING the single
# `search_cards` role alias and keeping `draw_support`. This is the DIAGNOSTIC half of
# the Pass-19 ablation pair: it isolates the `draw_support` discard effect on its own.
# If the parent-H2H regression is driven by draw_support (as the decision-replay
# indicates), this candidate should reproduce the regression while search_only does not.
# No deck change. No invented ids. Broad Main stays delegated to the base policy.

deck_id: league_dragapult_v1_draw_only
parent_deck_id: league_dragapult_spread_v1
based_on: generic_core_pilot
schema: activegraph.playbook.core_pilot/v1

refinement:
  kind: ablation
  summary: >-
    Drop the search_cards role alias (keep draw_support). Diagnostic isolation of the
    draw_support discard effect; expected to reproduce the parent-H2H regression. No
    deck or plan changes.
  changed_roles: [search_cards]
  dropped_roles: [search_cards]
  unchanged: [deck, plan, role_weights, deckout_guard_thresholds, draw_support]

cards:
  119: Dreepy
  120: Drakloak
  121: Dragapult ex
  131: Duskull
  133: Dusknoir
  1079: Rare Candy
  1231: Dawn
  1224: Cheren
  1121: Ultra Ball
  1086: Buddy-Buddy Poffin
  1182: Boss's Orders
  1097: Night Stretcher
  5: Basic {P} Energy
  2: Basic {R} Energy

roles:
  basic_energy: [5, 2]
  setup_basic: [119, 131]
  evolution_mid: [120]
  evolution_payoff: [121, 133]
  evolution_accel: [1079]
  # DROPPED vs v1: search_cards (no observed decision delta; removed to isolate draw).
  # Kept: the draw_support alias (the diagnosed discard self-harm trigger).
  draw_support: [1224, 1231]
  # Back-compat aliases kept so older tooling still reads them:
  search: [1121, 1086]
  draw: [1224, 1231]
  energy: [5, 2]
  disruption: [1182]
  recovery: [1097]

plan:
  primary_plan: dragapult_spread
  secondary_plan: dusknoir_bench_pressure
  avoid_plans: [deckout, orphan_evolution]

role_weights:
  active_prefers: [evolution_payoff, setup_basic]
  bench_prefers: [setup_basic, evolution_mid, evolution_payoff]
  attach_prefers: [active_attacker, next_attacker]
  search_prefers: missing_evolution_piece
  discard_prefers: [surplus_basic_energy]
  preserve_only:
    - setup_basic
    - evolution_mid
    - evolution_payoff_when_setup_exists

deckout_guard_thresholds:
  penalize: 8
  heavy: 4
  critical: 2

deck_specific_constraints:
  - Keep at least one Dreepy (setup_basic) so Dragapult ex is never orphaned.
  - Prefer Rare Candy onto Dreepy to jump to Dragapult ex when the basic is established.
  - Never search the payoff (Dragapult ex / Dusknoir) with no corresponding basic in play.

unsafe_or_deferred:
  - Spread-damage placement (Phantom Dive distribution) is NOT modeled by the generic
    pilot (compatibility gap); damage spreading is left to the base policy.
  - Rare Candy timing is advisory only.
  - Broad Main remains delegated to the base policy.

notes:
  - Ablation of league_dragapult_spread_v1: search_cards dropped, draw_support kept.
  - Runtime contexts (1, 2, 7, 8, 38) match v1 so the only delta is the dropped alias.
  - Expected effect: reproduces the parent-H2H regression (discard self-harm persists).
