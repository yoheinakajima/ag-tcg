# ActiveGraph Pass 17 — Dragapult ex spread / control (Stage 2 evolution power).
#
# Evolution payoff deck: Dreepy -> Drakloak -> Dragapult ex with a Duskull ->
# Dusknoir support line and Rare Candy acceleration. Tests the generic pilot's
# evolution sequencing. All ids confirmed in data/cards/EN_Card_Data.csv
# (gitignored, never committed). No invented ids.

deck_id: league_dragapult_spread
based_on: generic_core_pilot
schema: activegraph.playbook.core_pilot/v1

cards:
  119: Dreepy
  120: Drakloak
  121: Dragapult ex
  131: Duskull
  133: Dusknoir
  1079: Rare Candy
  1231: Dawn
  1224: Cheren
  1121: Ultra Ball
  1086: Buddy-Buddy Poffin
  1182: Boss's Orders
  1097: Night Stretcher
  5: Basic {P} Energy
  2: Basic {R} Energy

roles:
  basic_energy: [5, 2]
  setup_basic: [119, 131]
  evolution_mid: [120]
  evolution_payoff: [121, 133]
  evolution_accel: [1079]
  search: [1121, 1086]
  draw: [1224, 1231]
  energy: [5, 2]
  disruption: [1182]
  recovery: [1097]

plan:
  primary_plan: dragapult_spread
  secondary_plan: dusknoir_bench_pressure
  avoid_plans: [deckout, orphan_evolution]

role_weights:
  active_prefers: [evolution_payoff, setup_basic]
  bench_prefers: [setup_basic, evolution_mid, evolution_payoff]
  attach_prefers: [active_attacker, next_attacker]
  search_prefers: missing_evolution_piece
  discard_prefers: [surplus_basic_energy]
  preserve_only:
    - setup_basic
    - evolution_mid
    - evolution_payoff_when_setup_exists

deckout_guard_thresholds:
  penalize: 8
  heavy: 4
  critical: 2

deck_specific_constraints:
  - Keep at least one Dreepy (setup_basic) so Dragapult ex is never orphaned.
  - Prefer Rare Candy onto Dreepy to jump to Dragapult ex when the basic is established.
  - Avoid searching Dragapult ex / Dusknoir with no corresponding basic in play.

unsafe_or_deferred:
  - Spread-damage placement (Phantom Dive distribution) is NOT modeled by the generic
    pilot (compatibility gap); damage spreading is left to the base policy.
  - Rare Candy timing is advisory only.
  - Broad Main remains delegated to the base policy.

notes:
  - Roles only; generic competence (mechanics/score) drives play.
  - Runtime contexts (1, 2, 7, 8, 38) let the pilot express evolution setup preferences.
