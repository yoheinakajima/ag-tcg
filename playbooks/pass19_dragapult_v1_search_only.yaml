# ActiveGraph Pass 19 — Dragapult ex, v1 SEARCH-ONLY ablation (targeted revert).
#
# Derived from playbooks/pass18_dragapult_spread_v1.yaml by DROPPING the single
# `draw_support` role alias and keeping `search_cards`. This is the evidence-justified
# targeted revert of the suspected H2H-regression cause:
#   Pass-19 decision-replay (data/experiments/pass19_dragapult_parent_child_trace) shows
#   the ONLY parent->child behavioral divergence is in the discard branch, where the
#   child's `draw_support` alias adds +10 in score_discard_candidate and makes it discard
#   its OWN draw engine. The `search_cards` alias produced NO observable decision delta.
# Removing `draw_support` should restore the parent's discard behavior (keep the draw
# engine) while leaving everything else byte-for-byte as v1. No deck change. No invented
# ids. Broad Main stays delegated to the base policy.

deck_id: league_dragapult_v1_search_only
parent_deck_id: league_dragapult_spread_v1
based_on: generic_core_pilot
schema: activegraph.playbook.core_pilot/v1

refinement:
  kind: ablation
  summary: >-
    Drop the draw_support role alias (keep search_cards). Targeted revert of the
    Pass-19-diagnosed discard self-harm; the discard scorer no longer treats the draw
    engine as preferentially discardable. No deck or plan changes.
  changed_roles: [draw_support]
  dropped_roles: [draw_support]
  unchanged: [deck, plan, role_weights, deckout_guard_thresholds, search_cards]

cards:
  119: Dreepy
  120: Drakloak
  121: Dragapult ex
  131: Duskull
  133: Dusknoir
  1079: Rare Candy
  1231: Dawn
  1224: Cheren
  1121: Ultra Ball
  1086: Buddy-Buddy Poffin
  1182: Boss's Orders
  1097: Night Stretcher
  5: Basic {P} Energy
  2: Basic {R} Energy

roles:
  basic_energy: [5, 2]
  setup_basic: [119, 131]
  evolution_mid: [120]
  evolution_payoff: [121, 133]
  evolution_accel: [1079]
  # Kept: the search alias (no observed decision delta, retained for parity with v1).
  search_cards: [1121, 1086]
  # DROPPED vs v1: draw_support (the diagnosed discard self-harm trigger).
  # Back-compat aliases kept so older tooling still reads them:
  search: [1121, 1086]
  draw: [1224, 1231]
  energy: [5, 2]
  disruption: [1182]
  recovery: [1097]

plan:
  primary_plan: dragapult_spread
  secondary_plan: dusknoir_bench_pressure
  avoid_plans: [deckout, orphan_evolution]

role_weights:
  active_prefers: [evolution_payoff, setup_basic]
  bench_prefers: [setup_basic, evolution_mid, evolution_payoff]
  attach_prefers: [active_attacker, next_attacker]
  search_prefers: missing_evolution_piece
  discard_prefers: [surplus_basic_energy]
  preserve_only:
    - setup_basic
    - evolution_mid
    - evolution_payoff_when_setup_exists

deckout_guard_thresholds:
  penalize: 8
  heavy: 4
  critical: 2

deck_specific_constraints:
  - Keep at least one Dreepy (setup_basic) so Dragapult ex is never orphaned.
  - Prefer Rare Candy onto Dreepy to jump to Dragapult ex when the basic is established.
  - Never search the payoff (Dragapult ex / Dusknoir) with no corresponding basic in play.

unsafe_or_deferred:
  - Spread-damage placement (Phantom Dive distribution) is NOT modeled by the generic
    pilot (compatibility gap); damage spreading is left to the base policy.
  - Rare Candy timing is advisory only.
  - Broad Main remains delegated to the base policy.

notes:
  - Ablation of league_dragapult_spread_v1: draw_support dropped, search_cards kept.
  - Runtime contexts (1, 2, 7, 8, 38) match v1 so the only delta is the dropped alias.
  - Expected effect: restores parent-like discard behavior (preserve the draw engine).
