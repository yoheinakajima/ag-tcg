gameplan:
  primary: Kyogre pressure
  secondary: Snover -> Mega Abomasnow ex setup
  avoid: self-deckout and orphan Mega Abomasnow line
opening:
  active_priority:
  - Kyogre when available with Water/search support
  - Snover when evolution support is strong
  bench_priority:
  - Kyogre
  - Snover
  - avoid unnecessary benching if no payoff
main_phase_priorities:
- develop Kyogre attacker and attach Water
- establish Snover -> Mega Abomasnow ex line when payoff is reachable
- use Ultra Ball / Mega Signal to complete the missing piece, not duplicates
- draw with Lillie / Petrel only when deck count is healthy
- never thin into a deckout
effect_resolution:
  decline_mega_signal_no_snover: false
  notes:
  - effect-resolution card targeting is deck-specific (Pass 8 lesson)
discard_safety:
  protect_setup: true
  prefer_discard:
  - 3
  never_discard_only:
  - 722
  - 723
  - 721
  avoid_discarding_only_search_if_setup_incomplete: true
search:
  avoid_orphan_evolution: false
  avoid_orphan_mega_signal: false
  ultra_ball:
  - discard excess Water first
  - if no Snover on board/hand, search Snover over Mega Abomasnow
  - if Snover exists, search Mega Abomasnow
  - if no attacker exists, search Kyogre or Snover
  - avoid low-value duplicate search
secret_box:
  play_safety: advisory
  forced_discard_all_is_failure: false
  to_hand_priority:
  - Powerglass if Kyogre active and no tool
  - Mega Signal only if Snover line exists or is preserved
  - Lillie/Petrel only when deck count is healthy
  - Surfing Beach only if not already in play
  - avoid redundant stadium
deckout_guard:
  decline_threshold: 4
  tiers:
  - deckCount <= 8: penalize optional draw/search
  - deckCount <= 4: heavily penalize optional draw/search
  - deckCount <= 2: prefer attack/attach/end unless immediate win/survival
attachment:
- attach Water to active Kyogre if attacking plan
- attach tool Powerglass to active Kyogre if no tool
- otherwise attach to next attacker
- avoid attaching to a low-value target when a better target exists
fixture_requirements:
  must_pass_hard: true
  secret_box_forced_all_is_na: true
  improves_advisory_to_hand_priority: true
report_notes:
- Fixture gate beats raw win rate (Pass 8).
- Secret Box forced-discard-all is NA, not a policy failure.
- Secret Box pre-play safety is not deterministically gradeable.
- Effect-resolution card targeting is deck-specific.
- Deck-specific pilot abstraction is now required.
- 'DESIGN-ONLY: a hard ''must attack by turn N'' deadline is not wired into RULE_MAP;
  only the deckout threshold is.'
- 'tempo hypothesis: Attack before over-thinning: minimal search guards + an aggressive
  deckout decline (<=4) so it commits to attacking.'
