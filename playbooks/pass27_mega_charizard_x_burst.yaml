# ActiveGraph Pass 27 — Mega Charizard X ex Fire burst (Stage 2 evolution burst).
#
# Evolution burst deck: Charmander -> Charmeleon -> Mega Charizard X ex with
# Rare Candy acceleration, Crispin / Firebreather energy acceleration and an
# Oricorio ex support basic. Tests the generic pilot's evolution sequencing AND
# energy-dump burst timing (loading a big attacker fast). All ids confirmed in
# data/cards/EN_Card_Data.csv (gitignored, never committed). No invented ids.

deck_id: league_mega_charizard_x_burst
based_on: generic_core_pilot
schema: activegraph.playbook.core_pilot/v1

cards:
  788: Charmander
  789: Charmeleon
  790: Mega Charizard X ex
  795: Oricorio ex
  1232: Firebreather
  1198: Crispin
  1079: Rare Candy
  1121: Ultra Ball
  1086: Buddy-Buddy Poffin
  1182: Boss's Orders
  1097: Night Stretcher
  1231: Dawn
  1224: Cheren
  2: Basic {R} Energy

roles:
  basic_energy: [2]
  setup_basic: [788, 795]
  evolution_mid: [789]
  evolution_payoff: [790]
  evolution_accel: [1079]
  energy_accel: [1232, 1198]
  search: [1121, 1086]
  draw: [1231, 1224]
  energy: [2]
  disruption: [1182]
  recovery: [1097]

plan:
  primary_plan: mega_charizard_x_burst
  secondary_plan: fire_energy_acceleration
  avoid_plans: [deckout, orphan_evolution, energy_starved_attack]

role_weights:
  active_prefers: [evolution_payoff, setup_basic]
  bench_prefers: [setup_basic, evolution_mid, evolution_payoff]
  attach_prefers: [active_attacker, next_attacker]
  search_prefers: missing_evolution_piece
  discard_prefers: [surplus_basic_energy]
  preserve_only:
    - setup_basic
    - evolution_mid
    - evolution_payoff_when_setup_exists

deckout_guard_thresholds:
  penalize: 8
  heavy: 4
  critical: 2

deck_specific_constraints:
  - Keep at least one Charmander (setup_basic) so Mega Charizard X ex is never orphaned.
  - Prefer Rare Candy onto Charmander to jump to Mega Charizard X ex once the basic is established.
  - Use Crispin / Firebreather to accelerate Fire energy onto the payoff attacker.

unsafe_or_deferred:
  - Energy-ACCELERATION sequencing (Crispin/Firebreather targeting) is NOT modeled
    by the generic pilot (compatibility gap); accel is left to the base policy.
  - Rare Candy timing is advisory only.
  - Broad Main remains delegated to the base policy.

notes:
  - Roles only; generic competence (mechanics/score) drives play.
  - Runtime contexts (1, 2, 7, 8, 38) let the pilot express evolution + burst preferences.
