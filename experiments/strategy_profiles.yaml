# ActiveGraph Pass 35 — StrategyProfile registry (typed board-aware strategy layer).
#
# LOCAL ONLY. No Kaggle upload/submit, no GitHub push. Every card id below is
# confirmed present in data/cards/EN_Card_Data.csv (that CSV is gitignored and
# NEVER committed). NO invented ids. The builder
# (scripts/build_pass35_strategy_profiles.py) validates each profile against
# src/ptcg_activegraph/pilot_typed/profiles.py and re-checks id existence, then
# renders data/experiments/pass35_strategy_profiles.{json,md}.
#
# A StrategyProfile is the deck-specific INPUT the typed-lite tactics consume. It
# does NOT change the 60-card deck.csv; it tells the typed pilot which cards play
# which role so it can refine the observable contexts (0,1,2,7,8,38) and bail to
# the proven base policy on any mismatch/error.
#
# HONESTY CONTRACT (applies to every profile):
#   The typed lane observes board STATE only. It does NOT model attack damage,
#   lethal, KO targeting, spread placement, Boss/gust target choice, or the
#   opponent's hand. These are listed in `unsupported_mechanics` for every deck.
#   No profile claims a deck mechanic the runtime cannot honestly compute.
#
# Basic Energy card ids: 1={G}Grass 2={R}Fire 3={W}Water 4={L}Lightning
#   5={P}Psychic 6={F}Fighting 7={D}Darkness 8={M}Metal.

schema: activegraph.strategy_profiles/v1
pass: "35"
lane: stdlib_typed_lite
no_upload: true
upload_performed: false

# The honest unsupported-mechanic set every executable profile carries. These are
# the mechanics the typed board observation cannot compute; the pilot never acts
# on them and always falls back to the base policy where they would be needed.
default_unsupported_mechanics:
  - attack_damage
  - lethal
  - ko_targeting
  - spread
  - boss
  - gust
  - opponent_hand

