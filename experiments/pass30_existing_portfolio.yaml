        blocked_from_league: true
        block_reason: >
          Deckout/mill is the win condition and needs special triggers the generic
          core pilot does not implement; piloted generically it misplays the
          carousel, so it is scout-only and excluded from the tournament.
        notes: "Built + smoke-tested for honesty; excluded from the tournament."
