# Strategy seam taxonomy (machine-readable).
#
# A "seam" is a place where the agent/deck can be varied to produce a testable
# experiment branch. Each seam declares:
#   id               unique dotted id (family.short_name)
#   family           one of: deck_construction | policy | archetype | evaluation | reporting
#   description      one-line human summary
#   default_priority 0..100 (higher = tested earlier)
#   risk             low | medium | high (chance of breaking package/smoke)
#   requires         data/capabilities needed before it can be tested
#   enabled          whether the lab may generate candidates for it now
#
# "requires" tokens understood by the lab:
#   cabt_schema        the recorded cabt option schema (always present here)
#   official_card_csv  data/cards/EN_Card_Data.csv (present -> deck seams testable)
#   none               nothing beyond the baseline runtime
#
# Edit `enabled` / `default_priority` freely; the generator and planner read this.

seams:
  # ----------------------------- deck construction ------------------------
  - id: deck.energy_trim
    family: deck_construction
    description: Reduce excess basic-energy count, add consistency/search trainers.
    default_priority: 90
    risk: medium
    requires: [official_card_csv]
    enabled: true
  - id: deck.consistency_engine
    family: deck_construction
    description: Maximise draw/search trainer density for steadier setup.
    default_priority: 85
    risk: medium
    requires: [official_card_csv]
    enabled: true
  - id: deck.attacker_focus
    family: deck_construction
    description: Increase confirmed attacker/evolution counts within legality.
    default_priority: 70
    risk: medium
    requires: [official_card_csv]
    enabled: true
  - id: deck.abomasnow_line_focus
    family: deck_construction
    description: Lean into a Snover -> Mega Abomasnow ex line.
    default_priority: 60
    risk: high
    requires: [official_card_csv, abomasnow_cards_confirmed]
    enabled: false
  - id: deck.anti_baseline
    family: deck_construction
    description: Tech specifically against the mirror/baseline deck.
    default_priority: 40
    risk: high
    requires: [official_card_csv, meta_counters_identified]
    enabled: false
  - id: deck.prize_liability
    family: deck_construction
    description: Lower single-prize liability / improve prize trade math.
    default_priority: 45
    risk: high
    requires: [official_card_csv, prize_values_identified]
    enabled: false
  - id: deck.recovery_package
    family: deck_construction
    description: Add recovery/recycle cards for late-game grind.
    default_priority: 42
    risk: high
    requires: [official_card_csv, recovery_cards_identified]
    enabled: false

  # --------------------------------- policy -------------------------------
  - id: policy.attack_priority
    family: policy
    description: Increase preference for confirmed attack option type 13.
    default_priority: 80
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: policy.pass_avoidance
    family: policy
    description: Strengthen penalty on pass/end (type 14) options.
    default_priority: 78
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: policy.evolution_priority
    family: policy
    description: Bias toward evolve/evolution-flavoured options.
    default_priority: 75
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: policy.energy_priority
    family: policy
    description: Bias toward attach/energy options when no attack available.
    default_priority: 72
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: policy.search_targeting
    family: policy
    description: Bias toward draw/search/supporter/item options.
    default_priority: 72
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: policy.bench_pressure
    family: policy
    description: Favour benching/placement (type 8) for board development.
    default_priority: 50
    risk: low
    requires: [cabt_schema]
    enabled: true

  # ----------------- policy: replay-derived effect resolution -------------
  # Added in Pass 4 from the Kaggle replay analysis. The agent's main weakness
  # is no longer legality/basic ranking; it is effect-resolution card choice on
  # multi-step search/discard prompts (Ultra Ball / Secret Box / Mega Signal).
  # The override hook is keyword/option-type weighting only (no board-state card
  # targeting), so these are honest *lightweight keyword-weight approximations*,
  # not a rule engine.
  - id: policy.effect_resolution_targeting
    family: policy
    description: Choose effect-resolution targets (search/discard) by role, not first-legal.
    default_priority: 95
    risk: low
    requires: [cabt_schema, official_card_csv]
    enabled: true
  - id: policy.ultra_ball_discard_and_search
    family: policy
    description: Ultra Ball (1121) — discard low value, search highest-priority missing piece.
    default_priority: 92
    risk: low
    requires: [cabt_schema, official_card_csv]
    enabled: true
  - id: policy.secret_box_mode_selection
    family: policy
    description: Secret Box (1092) — pick high-leverage item/supporter/tool/stadium targets.
    default_priority: 88
    risk: low
    requires: [cabt_schema, official_card_csv]
    enabled: true
  - id: policy.mega_signal_evolution_search
    family: policy
    description: Mega Signal (1145) — search Mega Abomasnow line only when Snover is available.
    default_priority: 86
    risk: low
    requires: [cabt_schema, official_card_csv]
    enabled: true
  - id: policy.attach_targeting
    family: policy
    description: Attach energy/tools to the active/next-turn attacker, not first legal target.
    default_priority: 84
    risk: low
    requires: [cabt_schema, official_card_csv]
    enabled: true
  - id: policy.setup_active_choice
    family: policy
    description: Choose opening Active (Kyogre vs Snover) by race-vs-evolve matchup intent.
    default_priority: 80
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: policy.deckout_awareness
    family: policy
    description: Avoid unnecessary draw/search when deck count is low (deckout safety).
    default_priority: 70
    risk: low
    requires: [cabt_schema]
    enabled: true
  - id: combo.effect_resolution_deckout
    family: policy
    description: Combine board-aware effect resolution with deckout awareness (Pass 5).
    default_priority: 90
    risk: low
    requires: [cabt_schema]
    enabled: true

