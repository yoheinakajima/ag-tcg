# ActiveGraph Pass 17 — deck idea registry (internal deck league).
#
# LOCAL ONLY. No Kaggle upload. Every card id below is confirmed present in
# data/cards/EN_Card_Data.csv (that CSV is gitignored and never committed). No
# invented ids. `cards` are the FINAL 60-card composition (skeleton + documented
# filler); the validator (scripts/validate_deck_ideas.py) checks id existence,
# legality (<=4 non-basic-energy), basic-energy resolution, and the 60-card total.
#
# Role: this file is both the validation input (Part C) and the build input
# (Part E). `buildable` decks become league candidates; `blocked` decks are
# validated + given a playbook but kept out of the league with a reason.

schema: activegraph.deck_ideas/v1
pass: "17"

# Basic Energy card ids (category "Basic Energy" in EN_Card_Data.csv).
basic_energy_ids: [1, 2, 3, 4, 5, 6]

decks:

  # A. Current clean Water reference — the proven core_pilot_water_v2_runtime deck.
  water_core_reference:
    name: Water core reference (Kyogre / Snover / Mega Abomasnow ex)
    candidate_id: league_water_core_reference
    buildable: true
    role: reference
    deck_source: core_pilot_water_v2_runtime    # deck.csv copied byte-for-byte from this tarball
    playbook: playbooks/pass17_water_core_reference.yaml
    runtime_contexts: [7, 8]                     # faithful to the v2 reference
    cards:
      3: 29        # Basic {W} Energy
      721: 4       # Kyogre (primary basic attacker)
      722: 4       # Snover (setup basic)
      723: 4       # Mega Abomasnow ex (evolution payoff)
      1092: 1      # Secret Box (high-risk search)
      1121: 4      # Ultra Ball (search)
      1145: 2      # Mega Signal (search)
      1163: 2      # Powerglass (tool)
      1219: 4      # Team Rocket's Petrel (draw)
      1227: 4      # Lillie's Determination (draw)
      1262: 2      # Surfing Beach (stadium)
    filler: "None — uses the proven v2 60-card list verbatim."

