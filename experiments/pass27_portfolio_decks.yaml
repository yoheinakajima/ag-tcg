# ActiveGraph Pass 27 — Multi-Archetype Core Gameplay Portfolio deck registry.
#
# LOCAL ONLY. No Kaggle upload, no GitHub push. Every card id below is confirmed
# present in data/cards/EN_Card_Data.csv (that CSV is gitignored and never
# committed). NO invented ids. `cards` is the FINAL 60-card composition; the
# validator (scripts/validate_pass27_decks.py) checks id existence, legality
# (<=4 copies of any non-basic-energy card), basic-energy resolution, and the
# 60-card total.
#
# Purpose: run the SAME generic core pilot across SEVEN deck archetypes to
# surface which fundamental gameplay competencies still fail when the deck (not
# the pilot) changes. Four families carry forward from Pass 17 (the proven Water
# reference, Raging Bolt aggro, Dragapult evolution control, and the chaos Durant
# mill which stays BLOCKED from the league); three NEW high-ceiling Mega
# evolution families are added this pass (Gardevoir Psychic ramp, Charizard X
# Fire burst, Venusaur bulky Grass tank).

schema: activegraph.pass27.portfolio_decks/v1
pass: "27"
upload_performed: false

# Basic Energy card ids (stage/type "Basic Energy" in EN_Card_Data.csv).
basic_energy_ids: [1, 2, 3, 4, 5, 6, 7, 8]

